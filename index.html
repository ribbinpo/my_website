<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="I’m Teerawut Saesim, a Software Engineer designing software architectures and building end-to-end products with practical AI."
    />
    <meta name="theme-color" content="#146c5d" />
    <title>Teerawut Saesim — Software Engineer</title>
    <script>
      (() => {
        let theme = "system";
        try {
          theme = localStorage.getItem("profile-theme") || "system";
        } catch {}
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
